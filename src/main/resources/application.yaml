spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:twogether_db}
    username: ${POSTGRES_USER:twogether}
    password: ${POSTGRES_PASSWORD:twogether}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080