spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/${POSTGRES_DB:twogether_db}
    username: ${POSTGRES_USER:twogether}
    password: ${POSTGRES_PASSWORD:twogether}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://lekmsfkqflrdoouqtpyc.supabase.co/auth/v1/.well-known/jwks.json
          jws-algorithms: ES256

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
server:
  port: 8080

app:
  ai:
    chat-recommendation:
      topic-mode: ${AI_TOPIC_RECOMMENDATION_MODE:mock}
      mission-mode: ${AI_MISSION_RECOMMENDATION_MODE:mock}
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.5-flash}
      connect-timeout: ${GEMINI_CONNECT_TIMEOUT:3s}
      read-timeout: ${GEMINI_READ_TIMEOUT:15s}
    member-recommendation:
      mode: ${AI_MEMBER_RECOMMENDATION_MODE:mock}
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.5-flash}
      connect-timeout: ${GEMINI_CONNECT_TIMEOUT:3s}
      read-timeout: ${GEMINI_READ_TIMEOUT:15s}
    verification:
      mode: ${AI_VERIFICATION_MODE:mock}
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.5-flash}
      connect-timeout: ${GEMINI_CONNECT_TIMEOUT:3s}
      read-timeout: ${GEMINI_READ_TIMEOUT:15s}
      max-image-size: ${AI_VERIFICATION_MAX_IMAGE_SIZE:5242880}
      allowed-image-domains: ${AI_VERIFICATION_ALLOWED_IMAGE_DOMAINS:}
    content-recommendation:
      mode: ${AI_CONTENT_RECOMMENDATION_MODE:mock}
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.5-flash}
      connect-timeout: ${GEMINI_CONNECT_TIMEOUT:3s}
      read-timeout: ${GEMINI_READ_TIMEOUT:15s}
